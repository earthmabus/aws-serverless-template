name: Test AWS Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-aws.yml"

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::940827434048:role/GitHubActionsDeployRole
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-access:
    name: Test AWS OIDC Access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS caller identity
        run: |
          echo "Verifying AWS identity..."
          aws sts get-caller-identity

      - name: Verify AWS region
        run: |
          echo "Configured AWS region:"
          aws configure get region

      - name: Basic AWS API smoke test
        run: |
          echo "Listing S3 buckets to confirm AWS API access..."
          aws s3 ls || true

      - name: Success message
        run: |
          echo "GitHub Actions successfully authenticated to AWS using OIDC."
